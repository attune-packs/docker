ref: "docker.image_list"
label: "List Docker Images"
description: "List bounded selected image metadata"
enabled: true
runner_type: "python"
runtime_version: ">=3.10"
entry_point: "docker_action.py"
parameter_delivery: "stdin"
parameter_format: "json"
output_format: "json"
parameters:
  daemon_key:
    type: "string"
    default: "docker.daemon"
    required: true
  name:
    type: "string"
    description: "Optional repository/name filter"
  all:
    type: "boolean"
    default: false
  limit:
    type: "integer"
    minimum: 1
    maximum: 500
    default: 100
output:
  operation:
    type: "string"
    required: true
  endpoint:
    type: "string"
    required: true
  api_version:
    type: "string"
    required: true
  result:
    type: "object"
    required: true
tags:
  - "docker"
  - "image"
  - "list"
