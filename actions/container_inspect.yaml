ref: "docker.container_inspect"
label: "Inspect Docker Container"
description: "Return selected container state without environment or label values"
enabled: true
runner_type: "python"
runtime_version: ">=3.10"
entry_point: "docker_action.py"
parameter_delivery: "stdin"
parameter_format: "json"
output_format: "json"
parameters:
  daemon_key:
    type: "string"
    default: "docker.daemon"
    required: true
  container:
    type: "string"
    required: true
output:
  operation:
    type: "string"
    required: true
  endpoint:
    type: "string"
    required: true
  api_version:
    type: "string"
    required: true
  result:
    type: "object"
    required: true
tags:
  - "docker"
  - "container"
  - "inspect"
