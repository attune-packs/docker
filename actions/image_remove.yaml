{
  "ref": "docker.image_remove",
  "label": "Remove Docker Image",
  "description": "Remove one image without force after an exact confirmation",
  "enabled": true,
  "runner_type": "python",
  "runtime_version": ">=3.10",
  "entry_point": "docker_action.py",
  "parameter_delivery": "stdin",
  "parameter_format": "json",
  "output_format": "json",
  "parameters": {
    "daemon_key": {"type": "string", "default": "docker.daemon", "required": true},
    "image": {"type": "string", "required": true},
    "confirm": {"type": "string", "required": true, "description": "Must exactly match image"},
    "no_prune": {"type": "boolean", "default": false}
  },
  "output": {
    "operation": {"type": "string", "required": true},
    "endpoint": {"type": "string", "required": true},
    "api_version": {"type": "string", "required": true},
    "result": {"type": "object", "required": true}
  },
  "tags": ["docker", "image", "remove", "destructive"]
}
